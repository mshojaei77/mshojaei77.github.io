        },
        {
          "name": "image",
          "label": "Social image",
          "widget": "image",
          "default": "/assets/img/social-card.png",
          "required": false
        },
        {
          "name": "feed",
          "label": "Feed",
          "widget": "object",
          "fields": [
            {
              "name": "excerpt_only",
