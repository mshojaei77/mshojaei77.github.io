              "options": [
                "essay",
                "tutorial"
              ],
              "default": "essay"
            },
            {
              "name": "show_article_header",
              "label": "Render title and description above body",
              "widget": "boolean",
              "default": false,
              "hint": "Turn off if the body already contains its own H1."
            },
            {
              "name": "image",
              "label": "Social image",
              "widget": "image",
              "default": "/assets/img/social-card.png",
              "required": false
            },
            {
              "name": "feed",
              "label": "Feed",
              "widget": "object",
