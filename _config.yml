title: "Mohammad Shojaei"
lang: en
description: "Production AI engineering, writing, learning resources and community."

# Theme
remote_theme: just-the-docs/just-the-docs
color_scheme: light

# SEO and Social Media Optimization
url: "https://mshojaei77.github.io" # your site's URL
baseurl: "" # subpath of your site

# Enhanced meta tags for SEO
author: "Mohammad Shojaei"
twitter:
  username: realshojaei # Add your Twitter handle
  card: summary_large_image

# Social media sharing
social:
  name: Mohammad Shojaei
  links:
    - https://github.com/mshojaei77
    - https://linkedin.com/in/mshojaei77
    - https://twitter.com/realshojaei # Add if you have Twitter

# Enhanced SEO tags
tags: ["machine learning", "LLM", "AI", "deep learning", "transformers", "neural networks", "NLP", "artificial intelligence", "production ML", "MLOps"]
keywords: "LLM tutorial, Large Language Models, Transformer architecture, Machine Learning, AI development, Production ML"

# Public analytics and webmaster verification identifiers: _data/discovery.json.
# Empty identifiers intentionally emit no tracking script or verification tag.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/social-card.png
  - scope:
      path: ""
      type: posts
    values:
      seo:
        type: BlogPosting

# Site logo and branding
favicon_ico: "/assets/img/favicon.ico"

# Navigation
nav_sort: case_insensitive
nav_external_links: true

# Search configuration
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# Content features
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

# Last modified timestamps
last_edit_timestamp: true
last_edit_time_format: "%b %e %Y at %I:%M %p"

# GitHub integration
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "mshojaei77/mshojaei77.github.io"
gh_edit_branch: "main"

# Aux links for the upper right navigation
aux_links:
  "فارسی / FA": "/fa/"
  "Home": "/"
  "Writing": "/writing/"
  "🐙 GitHub": "https://github.com/mshojaei77"
  "Telegram channel": "https://t.me/LLMEngineers"
  "💬 Community": "https://t.me/AI_LLMs"

aux_links_new_tab: false

# All editorial content is published through _posts.
feed:
  posts_limit: 100

# Plugins
plugins:
  - jekyll-include-cache
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag

# Footer content
footer_content: "Copyright &copy; Mohammad Shojaei. All rights reserved. You may copy and distribute this work, but please note that it may contain other authors' works which must be properly cited. Any redistribution must maintain appropriate attributions and citations."

# Callouts configuration
callouts_level: quiet
callouts:
  highlight:
    color: yellow
  new:
    title: "New"
    color: green
  note:
    title: "Note"
    color: blue
  warning:
    title: "Warning"
    color: red

# kramdown settings
kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: false

# Exclude files
exclude:
  - vendor
  - .bundle
  - Gemfile
  - Gemfile.lock
  - /labs
  - scripts
  - README.md
