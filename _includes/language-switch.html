{% assign current_language = page.lang | default: 'en' %}
{% assign language_pair = site.data.languages | where: current_language, page.url | first %}
<div class="language-switch" role="group" aria-label="{% if current_language == 'fa' %}زبان سایت{% else %}Site language{% endif %}" dir="ltr">
{% if current_language == 'fa' %}
  <a lang="en" hreflang="en" href="{{ page.translation_url | default: page.english_source | default: language_pair.en | default: '/' }}">EN</a><span class="language-divider" aria-hidden="true">/</span><span lang="fa" aria-current="true">FA</span>
{% else %}
  <span lang="en" aria-current="true">EN</span><span class="language-divider" aria-hidden="true">/</span><a lang="fa" hreflang="fa" href="{{ page.translation_url | default: language_pair.fa | default: '/fa/' }}" aria-label="فارسی">FA</a>
{% endif %}
</div>
