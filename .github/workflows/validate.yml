name: Validate publication
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/jekyll-build-pages@v1
        with:
          source: .
          destination: ./_site
      - run: |
          python3 scripts/check_site.py _site
          python3 scripts/check_discovery.py _site
      - name: Test the document parsing tutorial
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
          python3 -m venv /tmp/tutorial-env
          /tmp/tutorial-env/bin/python -m pip install -r assets/examples/document-parsing/requirements.txt
          export TUTORIAL_TESSDATA="$(dirname "$(dpkg -L tesseract-ocr-eng | grep '/eng.traineddata$' | head -n 1)")"
          test -f "$TUTORIAL_TESSDATA/eng.traineddata"
          /tmp/tutorial-env/bin/python scripts/test_document_parsing_tutorial.py
      - name: Install browser test dependencies
        run: |
          npm install --prefix /tmp/publication-browser --no-audit --no-fund playwright@1.58.2
          /tmp/publication-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Browser layout and localization regression checks
        env:
          NODE_PATH: /tmp/publication-browser/node_modules
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory _site > /tmp/site-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:8765/ >/dev/null && break; sleep 1; done
          node scripts/check_studio.cjs
          node scripts/check_browser.cjs
      - name: Simulate independent English and Persian deletions in the CI checkout
        run: |
          python3 scripts/simulate_deletion.py
          python3 scripts/simulate_discovery.py
      - uses: actions/jekyll-build-pages@v1
        with:
          source: .
          destination: ./_site-deletion
      - name: Validate actual rebuilt deletion state
        run: |
          python3 scripts/check_site.py _site-deletion
          python3 scripts/check_date_override.py _site-deletion
          python3 scripts/check_discovery.py _site-deletion
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bilingual-browser-screenshots
          path: /tmp/publication-screenshots/
          if-no-files-found: ignore
