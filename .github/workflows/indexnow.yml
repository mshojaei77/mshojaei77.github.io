name: Notify IndexNow after deployment
on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
    branches: [main]
permissions:
  actions: read
  contents: read
concurrency:
  group: indexnow-main
  cancel-in-progress: false
jobs:
  notify:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/cache@v4
        id: processed
        with:
          path: .indexnow-run-marker
          key: indexnow-deployment-${{ github.event.workflow_run.id }}
      - name: Submit only changed, production-verified article URLs
        if: steps.processed.outputs.cache-hit != 'true'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INDEXNOW_PAGES_RUN_ID: ${{ github.event.workflow_run.id }}
        run: python3 scripts/indexnow.py
